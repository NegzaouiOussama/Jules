<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mon Panier</h1>
    </header>

    <main>
        <section class="cart-items">
            <h2>Articles dans votre panier</h2>
            <!-- Placeholder Cart Item -->
            <article class="cart-item">
                <span class="product-name">Nom du Produit 1</span>
                <span class="product-price">€XX.XX</span>
                <span class="product-quantity">Quantité: 1</span>
            </article>
            <article class="cart-item">
                <span class="product-name">Nom du Produit 2</span>
                <span class="product-price">€YY.YY</span>
                <span class="product-quantity">Quantité: 2</span>
            </article>
            <!-- More cart items will be listed here -->
        </section>

        <section class="cart-total">
            <h2>Total de la commande</h2>
            <p>Total: €ZZ.ZZ</p>
        </section>

        <section class="cart-actions">
            <button id="validate-order">Valider la commande</button>
            <a href="index.html">Continuer les achats</a>
        </section>
    </main>

    <footer>
        <!-- Footer content can be added later -->
    </footer>

    <script src="script.js"></script>
</body>
</html>
